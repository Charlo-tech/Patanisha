# TADHack 2025 - Conserver infrastructure
# Usage:
#   docker-compose up -d                    # Redis + PostgreSQL only
#   docker-compose --profile full up -d    # + Conserver (set SUPABASE_* in .env)
# See CONSERVER_SETUP.md for full instructions

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: conserver
      POSTGRES_PASSWORD: conserver_secret
      POSTGRES_DB: conserver
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conserver"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Conserver/vCon MCP - requires SUPABASE_* env vars for full functionality
  # Run without it: backend uses local fallback for vCon processing
  conserver-api:
    image: public.ecr.aws/r4g1k2s3/vcon-dev/vcon-mcp:main
    ports:
      - "8000:3000"
    environment:
      REDIS_URL: redis://redis:6379
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 3000
      MCP_HTTP_STATELESS: "true"
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      # Disable API auth for local dev (or set API_KEYS=your-key and CONSERVER_API_KEY in backend/.env)
      API_AUTH_REQUIRED: "false"
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - full

volumes:
  redis-data:
  postgres-data:
